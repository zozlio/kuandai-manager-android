<!-- 主容器 -->
<div id="app" class="app-container">

  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="menu-btn" onclick="openSidebar()">
      <span></span><span></span><span></span>
    </div>
    <h1 id="pageTitle">收入看板</h1>
    <div class="topbar-right" onclick="showAddAccountModal()" title="新增账号" role="button" aria-label="新增账号">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M11,5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></svg>
    </div>
  </header>

  <!-- 页面内容区 -->
  <div id="content" class="content"></div>

</div>

<!-- 底部 Tab -->
<div id="bottomNav" class="bottom-nav">
  <div class="bottom-nav-item active" onclick="navTo('dashboard')">

<!-- ====== 模态框 ====== -->

<!-- 新增账号 -->
<div id="addAccountModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>新增宽带账号</h2>
      <span class="close" onclick="closeModal('addAccountModal')">&times;</span>
    </div>
    <div class="modal-body" id="addAccountBody">
      <div class="form-group">
        <label>手机号 *</label>
        <input type="tel" id="new_phone" placeholder="如 13800138000" maxlength="11">
      </div>
      <div class="form-group">
        <label>宽带账号 *</label>
        <input type="text" id="new_account" placeholder="宽带账号">
      </div>
      <div class="form-group">
        <label>宽带注册码</label>
        <input type="text" id="new_regcode" placeholder="注册码">
      </div>
      <div class="form-row">
        <div class="form-group" style="flex:1">
          <label>注册人</label>
          <input type="text" id="new_owner" placeholder="注册人姓名">
        </div>
        <div class="form-group" style="flex:1">
          <label>手机卡使用人</label>
          <input type="text" id="new_carduser" placeholder="使用人">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group" style="flex:1">
          <label>机房</label>
          <input type="text" id="new_room" placeholder="机房名称">
        </div>
        <div class="form-group" style="flex:1">
          <label>节点平台</label>
          <input type="text" id="new_platform" placeholder="平台名称">
        </div>
      </div>
      <div class="form-group">
        <label>节点号</label>
        <input type="text" id="new_node" placeholder="节点号">
      </div>
      <div class="form-row">
        <div class="form-group" style="flex:1">
          <label>套餐原价 (元)</label>
          <input type="number" id="new_package" value="399" step="0.01">
        </div>
        <div class="form-group" style="flex:1">
          <label>运营商</label>
          <select id="new_carrier">
            <option value="电信">电信</option>
            <option value="联通">联通</option>
            <option value="移动">移动</option>
            <option value="广电">广电</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>备注</label>
        <input type="text" id="new_remark" placeholder="备注信息">
      </div>
      <button class="btn-primary" onclick="addAccount()" style="width:100%;margin-top:10px;">创建账号</button>
    </div>
  </div>
</div>

<!-- 充值 -->
<div id="rechargeModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>充值</h2>
      <span class="close" onclick="closeModal('rechargeModal')">&times;</span>
    </div>
    <div class="modal-body">
      <div id="rechargeAccountInfo" style="margin-bottom:14px;color:var(--fiber);font-size:14px;font-weight:600;"></div>
      <div class="form-group">
        <label>充值金额 (元)</label>
        <input type="number" id="recharge_amount" placeholder="输入金额" step="0.01" min="0">
      </div>
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <button class="btn-secondary" style="flex:1;padding:8px;font-size:13px;" onclick="quickRecharge(100)">+100</button>
        <button class="btn-secondary" style="flex:1;padding:8px;font-size:13px;" onclick="quickRecharge(200)">+200</button>
        <button class="btn-secondary" style="flex:1;padding:8px;font-size:13px;" onclick="quickRecharge(500)">+500</button>
      </div>
      <div id="rechargePreview" class="recharge-preview"></div>
      <button class="btn-primary" onclick="confirmRecharge()" style="width:100%;margin-top:10px;">确认充值</button>
    </div>
  </div>
</div>

<!-- 账号详情 -->
<div id="accountDetailModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>账号详情</h2>
      <span class="close" onclick="closeModal('accountDetailModal')">&times;</span>
    </div>
    <div class="modal-body" id="accountDetailBody"></div>
  </div>
</div>

<!-- 编辑账号 -->
<div id="editAccountModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>编辑账号</h2>
      <span class="close" onclick="closeModal('editAccountModal')">&times;</span>
    </div>
    <div class="modal-body" id="editAccountBody"></div>
  </div>
</div>

<!-- 记收入 -->
<div id="incomeModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>记收入</h2>
      <span class="close" onclick="closeModal('incomeModal')">&times;</span>
    </div>
    <div class="modal-body">
      <div id="incomeAccountInfo" style="margin-bottom:14px;color:var(--fiber);font-size:14px;font-weight:600;"></div>
      <div class="form-group">
        <label>日期</label>
        <input type="date" id="income_date">
      </div>
      <div class="form-group">
        <label>收入金额 (元)</label>
        <input type="number" id="income_amount" step="0.01" inputmode="decimal" placeholder="0.00">
      </div>
      <div class="form-group">
        <label>备注</label>
        <input type="text" id="income_note" placeholder="例如 平台结算">
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">同一天重复记录会覆盖，不改变账号余额</div>
      <button class="btn-primary" onclick="saveIncome()" style="width:100%;">保存收入</button>
    </div>
  </div>
</div>

<!-- 手动记一笔流水 -->
<div id="manualTxnModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>手动记一笔</h2>
      <span class="close" onclick="closeModal('manualTxnModal')">&times;</span>
    </div>
    <div class="modal-body">
      <div id="manualTxnInfo" style="margin-bottom:14px;color:var(--fiber);font-size:14px;font-weight:600;"></div>
      <div class="form-group">
        <label>类型</label>
        <select id="txn_kind">
          <option value="充值">充值（余额增加）</option>
          <option value="扣费">扣费（余额减少）</option>
          <option value="调整">调整（把余额设为该值）</option>
        </select>
      </div>
      <div class="form-group">
        <label>金额 (元)</label>
        <input type="number" id="txn_amount" step="0.01" inputmode="decimal" placeholder="0.00">
      </div>
      <div class="form-group">
        <label>备注</label>
        <input type="text" id="txn_note" placeholder="选填，例如 补扣上月底费">
      </div>
      <button class="btn-primary" onclick="saveManualTxn()" style="width:100%;">确认记账</button>
    </div>
  </div>
</div>

<!-- 导入文件选择（隐藏，由数据导入页触发）；accept 放宽到 */* 以兼容各家文件管理器 -->
<input type="file" id="importFile" accept="*/*" style="display:none;" onchange="onImportFileChange(event)">

<!-- 提示框 -->
<div id="toast" class="toast"></div>

<!-- 确认弹窗 -->
<div id="confirmDialog" class="modal">
  <div class="modal-content" style="max-width:320px;">
    <div class="modal-body" style="padding:20px;">
      <p id="confirmMessage" style="color:var(--ink);margin-bottom:16px;font-size:15px;line-height:1.5;"></p>
      <div style="display:flex;gap:10px;">
        <button class="btn-secondary" style="flex:1;" onclick="closeConfirm(false)">取消</button>
        <button class="btn-primary" style="flex:1;" onclick="closeConfirm(true)">确定</button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
