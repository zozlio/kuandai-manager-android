name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布的版本标签，如 v1.4.1；留空则只构建不发 Release'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 说明：不用 android-actions/setup-android@v3，它默认安装已被下架的
      # 'tools' 包，sdkmanager 会以非零码退出导致整步失败。
      # 改为直接使用 runner 预装的 cmdline-tools。
      - name: 准备 Android SDK
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=""
          for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/16.0/bin/sdkmanager"; do
            if [ -f "$c" ]; then SDKMANAGER="$c"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::在 $SDK 下找不到 sdkmanager"
            exit 1
          fi
          echo "使用 sdkmanager: $SDKMANAGER"
          if [ -x "$SDKMANAGER" ]; then
            SDK_CMD=("$SDKMANAGER")
          else
            SDK_CMD=(sh "$SDKMANAGER")
          fi
          yes | "${SDK_CMD[@]}" --licenses > /dev/null 2>&1 || true
          "${SDK_CMD[@]}" "platforms;android-36" "build-tools;36.0.0" \
            || sudo "${SDK_CMD[@]}" "platforms;android-36" "build-tools;36.0.0"

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4

      # 仓库里的 gradlew 没有可执行位（Contents API 写入固定为 100644），
      # 这里补上；下面还会尝试把可执行位写回仓库，方便别人 clone 后直接用。
      - name: 恢复 gradlew 可执行位
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git update-index --chmod=+x gradlew
          if git diff --cached --quiet; then
            echo "gradlew 已具备可执行位，无需修正"
          else
            git commit -m "chore: 恢复 gradlew 可执行位"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: 构建 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: kuandai-manager-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 发布 GitHub Release
        if: ${{ inputs.release_tag != '' }}
        env:
          TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" 2>/dev/null || echo "tag $TAG 已存在，沿用"
          git push origin "$TAG" 2>/dev/null || echo "tag $TAG 已推送，跳过"

          # GitHub 会把 Release 附件名里的非 ASCII 字符归一化成 "_"，
          # 所以另存一份纯 ASCII 文件名用于下载。
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          ASCII_APK="kuandai-manager$(printf '%s' "$(basename "$APK")" | LC_ALL=C tr -cd 'A-Za-z0-9._-')"
          cp "$APK" "$ASCII_APK"
          echo "Release 附件：$ASCII_APK"

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ASCII_APK" --clobber
          else
            gh release create "$TAG" "$ASCII_APK" --title "$TAG" --generate-notes
          fi
